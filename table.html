<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            border-spacing: 40px;
        }
        table,tr,td,th{
            border:1px solid red;
        }
        td,th{
            padding:20px;
        }


    </style>
</head>
<body>
    <table>
        <tr><th colspan="5" style="text-align:center;background-color:yellow;">Student mark list</th></tr>
        <tr>
            <td colspan="2" style="text-align:center;">Student detials</td>
            <td colspan="3" style="text-align: center;">Student marks</td>
        </tr>
        <tr>
            <th style="color: brown;">S.no</th>
            <th style="color: brown;">Student Name</th>
            <th style="color: brown;">Python</th>
            <th style="color: brown;">Java</th>
            <th style="color: brown;">C</th>
        </tr>
        </tr>
        <tr>
            <td>1</td>
            <td>Thamizhisai</td>
            <td>70</td>
            <td>75</td>
            <td>90</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Eyalisai</td>
            <td>80</td>
            <td>85</td>
            <td>90</td>
        </tr>
    </table>
</body>
</html>
